<!-- 1. TAMPILKAN DI DASHBOARD (Letakkan di halaman Dashboard) -->
<div id="dashboard-rate-info" class="rate-banner" style="padding:12px 16px; border-radius:12px; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); font-weight:600; margin-bottom:14px;">
  Harga per email: Good 4k • Captha 2k
</div>

<!-- 2. TAMPILKAN DI ADMIN PANEL (Untuk ubah harga Good & Captha langsung dari web) -->
<div class="admin-rate-box" style="display:grid; gap:10px; padding:14px; border-radius:12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); margin-top:12px;">
  <div style="font-weight:700; font-size:14px;">Pengaturan Harga Setoran (IDR)</div>
  
  <label style="font-size:12px; opacity:0.85;">Harga Good (IDR)</label>
  <input id="admin-rate-good" type="number" min="0" step="100" value="4000" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);" />

  <label style="font-size:12px; opacity:0.85;">Harga Captha (IDR)</label>
  <input id="admin-rate-captha" type="number" min="0" step="100" value="2000" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);" />

  <button id="btn-save-rates" type="button" style="padding:10px 14px; border-radius:8px; font-weight:700; cursor:pointer;">
    Simpan Harga
  </button>
</div>
